name: buffer-channels
# Manual: lists the channel ids a Buffer key can see (ids and names only, never the key).
on:
  workflow_dispatch:
    inputs:
      key_secret:
        description: "Secret name (BUFFER_API_KEY_BEINENU or BUFFER_API_KEY)"
        required: true
        default: BUFFER_API_KEY_BEINENU
permissions:
  contents: read
jobs:
  channels:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - env:
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
          BUFFER_API_KEY_BEINENU: ${{ secrets.BUFFER_API_KEY_BEINENU }}
        run: python -m publish channels --key-secret "${{ github.event.inputs.key_secret }}"
