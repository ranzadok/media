<!doctype html>
<html lang="he" dir="rtl"><head><meta charset="utf-8">
<style>
@font-face{font-family:Heebo;src:url(fonts/Heebo.woff);font-weight:100 900}
@font-face{font-family:Frank;src:url(fonts/FrankRuhlLibre.woff);font-weight:300 900}
html,body{margin:0;width:1080px;height:1920px;position:fixed;overflow:hidden;background:#000}
#stage{position:absolute;inset:0;overflow:hidden;font-family:Heebo,sans-serif}
.bg{position:absolute;inset:-10%}
.glow{position:absolute;width:900px;height:900px;border-radius:50%;filter:blur(10px)}
.grain{position:absolute;inset:0;opacity:.09;mix-blend-mode:overlay;pointer-events:none;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='300' height='300'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2'/></filter><rect width='300' height='300' filter='url(%23n)'/></svg>")}
.layer{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:0 90px;box-sizing:border-box}
.line{line-height:1.08;letter-spacing:-1px;margin:6px 0}
.block{display:inline-block;padding:4px 34px 14px;border-radius:18px}
.bubble{width:820px;padding:56px 60px;border-radius:56px;font-weight:700;font-size:64px;line-height:1.3;text-align:right;box-sizing:border-box}
.tag{margin-top:34px;font-weight:600;font-size:42px}
.stamp{position:absolute;font-weight:900;font-size:120px;border:10px solid;padding:4px 48px;border-radius:24px;box-shadow:0 20px 60px rgba(0,0,0,.5)}
.words{font-weight:700;font-size:72px;line-height:1.35}
.author{margin-top:40px;font-weight:500;font-size:38px;opacity:.75}
.phone{width:560px;height:1212px;border-radius:78px;background:#111;padding:18px;box-sizing:border-box}
.phone img{width:100%;height:100%;border-radius:62px;object-fit:cover;display:block;background:#000}
.cap{margin-top:56px;font-weight:800;font-size:60px}
.logo{width:240px;height:240px;border-radius:56px;box-shadow:0 30px 80px rgba(0,0,0,.5);object-fit:cover}
.round{border-radius:50%}
.pill{margin-top:46px;font-weight:700;font-size:46px;padding:22px 52px;border-radius:999px}
.small{font-weight:500;font-size:44px;opacity:.85;margin-top:28px}
.note{position:absolute;bottom:70px;left:0;right:0;text-align:center;font-size:28px;opacity:.6}
.caret{display:inline-block;width:6px;height:64px;vertical-align:-8px;margin-right:4px}
</style></head><body><div id="stage"><div class="bg" id="bg"></div><div class="glow" id="glow"></div><div id="layers"></div><div class="grain"></div><div class="note" id="note"></div></div>
<script>
// SCRIPT and THEME are injected before this runs: window.SCRIPT, window.THEME, window.ASSETS (base path for brand assets)
const $=id=>document.getElementById(id);
const cl=(x,a=0,b=1)=>Math.min(b,Math.max(a,x));
const ease=x=>1-Math.pow(1-cl(x),3);
const back=x=>{x=cl(x);const c=1.7;return 1+(c+1)*Math.pow(x-1,3)+c*Math.pow(x-1,2)};
const win=(t,a,b,fi=.18,fo=.22)=>cl((t-a)/fi)*cl((b-t)/fo);
function land(el,t,t0,dy=80){if(!el)return;const p=back((t-t0)/.45);el.style.opacity=cl((t-t0)/.2);el.style.transform=`translateY(${(1-p)*dy}px) scale(${.9+.1*p})`;}
const T=window.THEME, S=window.SCRIPT, A=window.ASSETS;
document.documentElement.style.setProperty('--x',1);
$('bg').style.background=T.bg; $('glow').style.background=`radial-gradient(circle,${T.glow},rgba(0,0,0,0) 65%)`;
$('stage').style.color=T.text;
if(S.note){$('note').textContent=S.note;}
const head=T.headFont==='Frank'?'Frank':'Heebo';
let t0=0; const scenes=S.scenes.map(sc=>{const s=Object.assign({},sc,{a:t0,b:t0+sc.dur});t0+=sc.dur;return s;});
window.DUR=t0; window.SCENES=scenes.map(s=>({type:s.type,a:s.a,b:s.b}));
const esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;');
const L=$('layers');
scenes.forEach((s,i)=>{
  const d=document.createElement('div');d.className='layer';d.id='L'+i;let h='';
  if(s.type==='title'){
    const fs=s.size||150;
    s.lines.forEach((ln,j)=>{const st=ln.block?`background:${T.blockBg};color:${T.blockText}`:(ln.accent?`color:${T.accent}`:'');
      h+=`<div class="line" id="L${i}_${j}" style="font-family:${head};font-weight:${T.headWeight};font-size:${ln.size||fs}px"><span class="${ln.block?'block':''}" style="${st}">${esc(ln.text)}</span></div>`;});
  } else if(s.type==='bubble'){
    const calm=s.style==='calm';
    const st=calm?`background:${T.cardSoftBg};border:3px solid ${T.cardSoftBorder};color:${T.text};border-bottom-left-radius:14px;font-weight:600;font-size:58px`
                 :`background:${T.cardBg};color:${T.cardText};border-bottom-right-radius:14px`;
    h+=`<div class="bubble" id="L${i}_b" style="${st}"></div>`;
    if(s.tag)h+=`<div class="tag" id="L${i}_t" style="color:${T.accent};${s.stamp?'margin-top:300px':''}">${esc(s.tag)}</div>`;
    if(s.stamp)h+=`<div class="stamp" id="L${i}_s" style="color:${T.accent};border-color:${T.accent};background:${T.stampBg}">${esc(s.stamp)}</div>`;
  } else if(s.type==='words'){
    const wl=s.text.length, wf=s.size||(wl<=26?118:wl<=60?88:72);
    h+=`<div class="words" id="L${i}_w" style="font-family:${s.serif?'Frank':'Heebo'};font-size:${wf}px;font-weight:${wl<=26?900:700}"></div>`;
    if(s.author)h+=`<div class="author" id="L${i}_a">${esc(s.author)}</div>`;
  } else if(s.type==='phone'){
    h+=`<div class="phone" id="L${i}_p" style="box-shadow:0 60px 120px rgba(0,0,0,.55),0 0 0 3px ${T.cardSoftBorder}"><img src="${A}/${s.image}"></div>`;
    if(s.caption)h+=`<div class="cap" id="L${i}_c" style="color:${T.accent}">${esc(s.caption)}</div>`;
  } else if(s.type==='end'){
    const ls=s.name?240:380;
    h+=`<img class="logo ${T.logoRound?'round':''}" id="L${i}_l" src="${A}/logo.png" style="width:${ls}px;height:${ls}px">`;
    if(s.name)h+=`<div class="line" id="L${i}_n" style="font-family:${head};font-weight:${T.headWeight};font-size:${s.nameSize||150}px;margin-top:40px">${esc(s.name)}</div>`;
    if(s.sub)h+=`<div class="small" id="L${i}_s">${esc(s.sub)}</div>`;
    if(s.pill)h+=`<div class="pill" id="L${i}_p" style="background:${T.accent};color:${T.blockText}">${esc(s.pill)}</div>`;
  }
  d.innerHTML=h;L.appendChild(d);
});
window.render=function(t){
  window.scrollTo(0,0);
  $('bg').style.transform=`scale(${1.05+.04*Math.sin(t*.35)}) rotate(${Math.sin(t*.2)*1.5}deg)`;
  $('glow').style.left=(560+220*Math.sin(t*.5))+'px';$('glow').style.top=(260+380*Math.cos(t*.37))+'px';
  $('note').style.opacity=S.note?.6:0;
  scenes.forEach((s,i)=>{
    const el=$('L'+i);const first=i===0,last=i===scenes.length-1;
    el.style.opacity=win(t,s.a,s.b,first?.01:.18,last?.01:.22);
    el.style.visibility=(t>=s.a-.05&&t<=s.b+.05)?'visible':'hidden';
    if(el.style.visibility==='hidden')return;
    const lt=t-s.a, q=id=>$('L'+i+'_'+id);
    if(s.type==='title'){
      const gap=s.gap||Math.min(.7,(s.dur-.8)/Math.max(1,s.lines.length));
      s.lines.forEach((ln,j)=>land(q(j),lt,.05+j*gap));
      const k=s.lines.length-1, kt=lt-(.05+k*gap);
      el.style.transform=(s.shake!==false&&kt>0&&kt<.2)?`translateX(${Math.sin(kt*120)*10}px)`:'none';
    } else if(s.type==='bubble'){
      const b=q('b');land(b,lt,.05,60);
      if(s.typing!==false&&s.style!=='calm'){
        const typeDur=s.typeDur||Math.min(2.6,s.dur*.45);const n=Math.round(cl((lt-.3)/typeDur)*s.text.length);
        b.innerHTML=esc(s.text.slice(0,n))+(lt<.3+typeDur+.2&&Math.floor(t*3)%2==0?`<span class="caret" style="background:${T.cardText}"></span>`:'');
      } else {
        const w=s.text.split(' ');const rd=s.revealDur||Math.min(3.2,s.dur*.55);const m=Math.round(cl((lt-.25)/rd)*w.length);
        b.innerHTML=w.map((x,j)=>`<span style="opacity:${j<m?1:.12}">${esc(x)}</span>`).join(' ');
      }
      const tg=q('t');if(tg)tg.style.opacity=cl((lt-(s.tagAt||s.dur*.5))/.3);
      const sp=q('s');if(sp){const st=lt-(s.stampAt||s.dur*.68);sp.style.opacity=st>0?1:0;
        sp.style.transform=`translateY(40px) rotate(-8deg) scale(${st>0?1+1.6*Math.pow(1-ease(st/.25),2):3})`;
        if(st>0){b.style.filter=`blur(${cl(st/.6)*3}px)`;b.style.opacity=1-.65*cl(st/.6);} else b.style.filter='none';
        el.style.transform=(st>0&&st<.18)?`translate(${Math.sin(st*140)*14}px,${Math.cos(st*120)*8}px)`:'none';}
    } else if(s.type==='words'){
      const w=s.text.split(' ');const rd=s.revealDur||Math.min(3.5,s.dur*.6);const m=Math.round(cl((lt-.2)/rd)*w.length);
      q('w').innerHTML=w.map((x,j)=>`<span style="display:inline-block;opacity:${j<m?1:.1};transform:translateY(${j<m?0:14}px);transition:none">${esc(x)}</span>`).join(' ');
      const a=q('a');if(a)a.style.opacity=.75*cl((lt-rd-.3)/.4);
    } else if(s.type==='phone'){
      const pp=ease(lt/.8);
      q('p').style.transform=`perspective(2000px) rotateY(${(1-pp)*-28+Math.sin(t*.9)*4}deg) rotateX(${(1-pp)*10}deg) translateY(${(1-pp)*240}px) scale(${.88+.12*pp})`;
      const c=q('c');if(c)land(c,lt,.6,30);
    } else if(s.type==='end'){
      land(q('l'),lt,.1,40);land(q('n'),lt,.4);land(q('s'),lt,.8,30);land(q('p'),lt,1.2,30);
    }
  });
};
render(0);
</script></body></html>
